version = 1

# First-party text and configuration files are annotated here when an inline
# header would disrupt their format, generated output, or public presentation.
[[annotations]]
path = [
  ".dockerignore",
  ".env.example",
  ".github/**",
  ".gitignore",
  ".python-version",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "Dockerfile",
  "NOTICE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "bootstrap.sh",
  "compliance/**",
  "docker-compose.yml",
  "docs/**",
  "examples/**",
  "macos/**",
  "packaging/**",
  "pyproject.toml",
  "requirements/**",
  "scripts/**",
  "src/**",
  "tests/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matthew Penkala"
SPDX-License-Identifier = "LicenseRef-PolyForm-Internal-Use-1.0.0"

# The lock is machine-generated from the first-party dependency declaration.
[[annotations]]
path = "uv.lock"
precedence = "override"
SPDX-FileCopyrightText = "2026 Matthew Penkala"
SPDX-License-Identifier = "LicenseRef-PolyForm-Internal-Use-1.0.0"

# Byte-identical package copies of the canonical third-party license texts are
# release inputs, not Auralign source. Reference each exact license identifier
# without attributing their legal text to an Auralign copyright holder.
[[annotations]]
path = [
  "LICENSES/MIT.txt",
  "packaging/macos/model-licenses/MIT.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "LICENSES/Apache-2.0.txt",
  "packaging/macos/model-licenses/Apache-2.0.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "LICENSES/CC-BY-4.0.txt",
  "packaging/macos/model-licenses/CC-BY-4.0.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC-BY-4.0"
