preset: max
offline: true
asr:
  backend: faster-whisper
  model: large-v3
  device: cpu
  compute_type: int8
  word_timestamps: true
diarization:
  backend: pyannote
  model: community-1
  device: cpu
  enabled: true
  preserve_overlap: true
  exclusive_diarization: true
alignment:
  backend: forced
  language: en
  model: en
  device: cpu
  enabled: true
speaker_id:
  mode: auto
  model: ecapa
  device: cpu
  minimum_segment_seconds: 1.0
  maximum_speech_seconds: 60.0
cleanup:
  mode: off
