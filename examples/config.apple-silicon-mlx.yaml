# Supported Apple Silicon MLX topology. The signed macOS app resolves the exact
# verified per-user pack through its fixed Application Support trust contract.
# Source development may instead use an ignored, verified model cache.
preset: max
model_cache: models
offline: true
asr:
  backend: mlx-whisper
  mlx_model: mlx-large-v3
  mlx_fp16: true
  mlx_vad_windowed: false
  vad_filter: false
  word_timestamps: true
  condition_on_previous_text: false
diarization:
  backend: pyannote
  model: community-1
  device: cpu
  enabled: true
  preserve_overlap: true
  exclusive_diarization: true
alignment:
  backend: forced
  language: en
  model: en
  device: cpu
  enabled: true
speaker_id:
  mode: auto
  model: ecapa
  device: cpu
redecode:
  mode: off
  max_spans: 5
  pad_seconds: 1.0
  beam_size: 5
  temperature: 0.0
  write_report: false
cleanup:
  mode: off
runtime:
  model_lifecycle: auto
