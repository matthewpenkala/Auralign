# Candidate profile for local Apple M3 Max validation.
# Keep as an opt-in benchmark starting point; it is not a global default.
preset: max
asr:
  model: large-v3
  device: cpu
  compute_type: int8
  cpu_threads: 8
  num_workers: 2
  word_timestamps: true
diarization:
  backend: pyannote
  device: cpu
  preserve_overlap: true
  exclusive_diarization: true
alignment:
  backend: auto
  device: cpu
cleanup:
  mode: off
