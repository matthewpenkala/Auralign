<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="418"
  viewBox="0 0 620 418" role="img"
  aria-label="Text-free Auralign Installer background, light appearance">
  <defs>
    <linearGradient id="main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F7FB"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C3A"/>
      <stop offset="0.58" stop-color="#07102A"/>
      <stop offset="1" stop-color="#03071C"/>
    </linearGradient>
    <linearGradient id="main-glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.24" stop-color="#EAF0FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9AADE2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="signal-surface" cx="50%" cy="16%" r="88%">
      <stop offset="0" stop-color="#0E1632" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#050D26" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#01061C" stop-opacity="0.90"/>
    </radialGradient>
    <radialGradient id="signal-light-pool" cx="50%" cy="8%" r="68%">
      <stop offset="0" stop-color="#5B70AD" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#29447D" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#02051D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signal-cyan-ambient" cx="29%" cy="50%" r="48%">
      <stop offset="0" stop-color="#20C9EA" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#138DD9" stop-opacity="0.018"/>
      <stop offset="1" stop-color="#07112E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signal-violet-ambient" cx="73%" cy="50%" r="48%">
      <stop offset="0" stop-color="#8454F1" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#5533C7" stop-opacity="0.021"/>
      <stop offset="1" stop-color="#07112E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F8FF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#7E9BE0" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#CDA6FF" stop-opacity="0.19"/>
    </linearGradient>
    <radialGradient id="inactive-knob" cx="50%" cy="22%" r="74%">
      <stop offset="0" stop-color="#C8D8F7"/>
      <stop offset="0.37" stop-color="#718AB8"/>
      <stop offset="1" stop-color="#344C79"/>
    </radialGradient>
    <radialGradient id="selected-knob" cx="50%" cy="22%" r="74%">
      <stop offset="0" stop-color="#FFF2A0"/>
      <stop offset="0.34" stop-color="#FFC841"/>
      <stop offset="0.74" stop-color="#FFAE17"/>
      <stop offset="1" stop-color="#B85E00"/>
    </radialGradient>
    <linearGradient id="wave" x1="18" y1="0" x2="228" y2="0"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25D8F0"/>
      <stop offset="0.18" stop-color="#19B9EE"/>
      <stop offset="0.38" stop-color="#148FEA"/>
      <stop offset="0.56" stop-color="#315FE5"/>
      <stop offset="0.72" stop-color="#5A4BE8"/>
      <stop offset="0.86" stop-color="#8249EF"/>
      <stop offset="1" stop-color="#A658EE"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1"
      gradientTransform="translate(211 24) rotate(90) scale(170 260)"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C83C8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6C83C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chromatic" cx="0" cy="0" r="1"
      gradientTransform="translate(594 412) rotate(-128) scale(300 410)"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7451C9" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#7451C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail-transition" x1="194" y1="0" x2="226" y2="0"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020515" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#020515" stop-opacity="0.24"/>
      <stop offset="0.53" stop-color="#F4F7FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A2B3E3" stop-opacity="0"/>
    </linearGradient>
    <filter id="wave-bloom" filterUnits="userSpaceOnUse"
      x="6" y="40" width="232" height="174"
      color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="wave-depth" filterUnits="userSpaceOnUse"
      x="8" y="46" width="228" height="164"
      color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="2.4" result="shadow-offset"/>
      <feColorMatrix in="shadow-offset" type="matrix"
        values="0 0 0 0 0.004
                0 0 0 0 0.016
                0 0 0 0 0.080
                0 0 0 0.62 0" result="shadow"/>
      <feOffset in="SourceAlpha" dy="1.2" result="alpha-down"/>
      <feComposite in="SourceAlpha" in2="alpha-down" operator="out"
        result="top-edge-mask"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.22"
        result="top-edge-color"/>
      <feComposite in="top-edge-color" in2="top-edge-mask" operator="in"
        result="top-edge"/>
      <feOffset in="SourceAlpha" dy="-1.2" result="alpha-up"/>
      <feComposite in="SourceAlpha" in2="alpha-up" operator="out"
        result="bottom-edge-mask"/>
      <feFlood flood-color="#07133A" flood-opacity="0.30"
        result="bottom-edge-color"/>
      <feComposite in="bottom-edge-color" in2="bottom-edge-mask" operator="in"
        result="bottom-edge"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="bottom-edge"/>
        <feMergeNode in="top-edge"/>
      </feMerge>
    </filter>
    <filter id="amber-bloom" filterUnits="userSpaceOnUse"
      x="110" y="82" width="26" height="253"
      color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="brand-clip">
      <rect x="0" y="0" width="211" height="418"/>
    </clipPath>
  </defs>

  <rect width="620" height="418" fill="url(#main)"/>
  <rect width="620" height="418" fill="url(#ambient)"/>
  <rect width="620" height="418" fill="url(#chromatic)"/>
  <rect width="620" height="418" fill="url(#main-glaze)"/>
