normal_preset_asr = [
  "max=large-v3",
  "balanced=turbo",
  "fast=distil-large-v3.5",
  "cpu=turbo",
]
blocked_normal_product_model_keys = []
bootstrap_model_keys = ["community-1", "en", "ecapa"]
native_download_model_keys = [
  "large-v3",
  "turbo",
  "distil-large-v3",
  "distil-large-v3.5",
  "mlx-tiny",
  "mlx-tiny.en",
  "mlx-base",
  "mlx-base.en",
  "mlx-small",
  "mlx-small.en",
  "mlx-medium",
  "mlx-medium.en",
  "mlx-large",
  "mlx-large-v2",
  "mlx-large-v3",
  "mlx-large-v3-turbo",
