component_root = "/Library/Application Support/com.auralign.studio/Models/com.auralign.studio.models.bootstrap.v1"
native_pack_root = "~/Library/Application Support/com.auralign.studio/Models/Packs/<pack-id>/<version>"
source_repository_weights = "prohibited"
loose_release_model_assets = "prohibited"
raw_cache_material = "prohibited"
tokens = "prohibited"
private_linkage_markers = "prohibited"
installer_runtime_or_model_acquisition = "prohibited"
native_verified_model_pack_acquisition = "permitted_for_exact_owner-cleared_catalog_entries"
installer_scripts = "prohibited"
build_tools = "maintainer_only"
recipient_toolchain_required = false

