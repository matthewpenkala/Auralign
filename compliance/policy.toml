schema_version = "1.0"
policy_id = "auralign-external-assets-v1"
reviewed_at = "2026-07-25"

[defaults]
unknown_license = "blocked"
unverified_provenance = "blocked"
mutable_or_missing_revision = "blocked"
model_production_redistribution = "blocked"
dataset_acquisition = "blocked"
dataset_mirroring = "blocked"

[license_classes]
automatically_allowed = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC-BY-4.0",
  "ISC",
  "MIT",
  "MIT-CMU",
  "CNRI-Python",
  "Python-2.0",
  "PSF-2.0",
]
conditionally_allowed = [
  "GPL-3.0-or-later",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MPL-2.0",
]
human_review_required = [
  "LicenseRef-Build-Configuration-Dependent",
  "LicenseRef-Docker-Official-Image-Mixed",
  "LicenseRef-NVIDIA-Deep-Learning-Container",
  "NOASSERTION",
]
prohibited_without_owner_evidence = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "SSPL-1.0",
  "LicenseRef-Proprietary-Unreviewed",
  "LicenseRef-Noncommercial",
  "LicenseRef-Field-of-Use-Restriction",
]

[requirements]
immutable_revision_format = "lowercase 40-character hexadecimal commit SHA"
required_registry_fields = [
  "kind",
  "key",
  "identifier",
  "revision",
  "license_expression",
  "source_url",
  "terms_url",
  "license_evidence_url",
  "attribution",
  "acquisition_status",
  "runtime_status",
  "redistribution_status",
  "review_status",
  "reviewed_at",
]
required_model_release_fields = [
  "product_classification",
  "backend_compatibility",
  "modification_status",
  "package_bundle_id",
  "package_bundle_version",
  "package_relative_path",
  "delivery",
  "macos_0_3_0_product_status",
  "macos_0_3_0_owner_decision",
  "macos_0_3_0_license_text",
  "macos_0_3_0_file_sha256",
  "macos_0_3_0_file_size",
]
component_registry = "compliance/components.toml"

[enforcement]
model_pull_requires_immutable_revision = true
model_pull_requires_verified_review = true
dataset_download_requires_explicit_manifest_approval = true
dataset_mirror_requires_explicit_manifest_approval = true
unverified_mlx_production_redistribution = "blocked"
unverified_sample_acquisition = "blocked"
voxceleb_acquisition_and_mirroring = "blocked_without_versioned_approval"
runtime_assets_must_not_be_bundled_in_source_distribution = true
release_specific_model_bundling_requires_owner_decision = true
model_component_requires_exact_revision_and_file_digests = true
model_component_requires_release_scoped_notices_and_sbom = true
model_pack_requires_deterministic_sbom = true
complete_product_sbom_must_include_packaged_bootstrap_bytes = true
signed_catalog_and_release_metadata_must_index_native_pack_sboms = true
model_component_must_exclude_tokens_private_markers_and_raw_caches = true
recipient_executable_runtime_acquisition = "blocked"
recipient_model_pack_acquisition = "allowed_only_through_native_exact_verified_pack_manager"
normal_processing_network_access = "blocked"
recipient_build_toolchain = "blocked"

