name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-gui:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked GUI test environment
        run: uv sync --locked --python 3.11 --extra dev --extra api
      - name: Test, analyze, and inspect native macOS GUI
        run: bash scripts/check_macos_gui.sh

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      vars.AURALIGN_ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, PSF-2.0

  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.26"
          enable-cache: true
          save-cache: ${{ matrix.python-version == '3.11' }}
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_VERSION: "8.1.2"
          FFMPEG_SHA256: "db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec"
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256) {
            throw "Pinned Windows FFmpeg archive digest mismatch."
          }
          Expand-Archive -Path $archive -DestinationPath $extractRoot
          $ffmpeg = Get-ChildItem -Path $extractRoot -Filter ffmpeg.exe -File -Recurse |
            Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "Pinned Windows FFmpeg archive did not contain ffmpeg.exe."
          }
          $ffprobe = Join-Path $ffmpeg.Directory.FullName "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) {
            throw "Pinned Windows FFmpeg archive did not contain ffprobe.exe."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpeg.Directory.FullName
      - name: Verify Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ffmpeg -version
          if ($version[0] -notmatch '^ffmpeg version 8\.1\.2-essentials_build-www\.gyan\.dev') {
            throw "Pinned Windows FFmpeg is shadowed or reported an unexpected version."
          }
          $version
          ffprobe -version
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync locked environment
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra api
      - name: Test on Python ${{ matrix.python-version }}
        run: >-
          uv run --python ${{ matrix.python-version }} pytest -q
          -o faulthandler_timeout=90
          -o faulthandler_exit_on_timeout=true
      - name: Lint (Python 3.11)
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Type check (Python 3.11)
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: uv run --python ${{ matrix.python-version }} mypy src/local_transcript_max

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install build Python
        run: uv python install 3.11
      - name: Verify lock
        run: uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify archive metadata, contents, and artifact SBOMs
        run: uv run --python 3.11 python scripts/verify_distribution.py --sbom-dir build/sbom
      - name: Install wheel in an isolated environment
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.11 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$wheel"
      - name: Smoke installed import and version metadata
        run: |
          .wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import local_transcript_max

          assert local_transcript_max.__version__ == version("local-transcript-max")
          PY
      - name: Smoke installed CLI
        run: .wheel-smoke/bin/ltm --help

  compliance:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Sync compliance tools
        run: uv sync --locked --python 3.11 --extra dev --extra api
      - name: Verify file-level licensing
        run: uv run --python 3.11 reuse lint
      - name: Verify legal and asset policy
        run: uv run --python 3.11 python scripts/check_compliance.py
      - name: Verify generated third-party notice is current
        run: uv run --python 3.11 python scripts/generate_third_party_notices.py --check
      - name: Generate source SPDX SBOM
        run: mkdir -p build/sbom && uv run --python 3.11 reuse spdx -o build/sbom/source.spdx
      - name: Export locked CPU production dependency set
        run: >-
          uv export --locked --extra full --group cpu --no-dev
          --no-emit-project -o build/cpu-requirements.txt
      - name: Generate CPU production dependency CycloneDX SBOM
        run: >-
          uv export --locked --extra full --group cpu --no-dev
          --format cyclonedx1.5 --preview-features sbom-export
          -o build/sbom/python-cpu.cdx.json
      - name: Validate CPU dependency graph SBOM
        run: >-
          uv run --python 3.11 python scripts/validate_dependency_sbom.py
          build/sbom/python-cpu.cdx.json --profile cpu
      - name: Assert CPU dependency profile is acceleration-clean
        run: >-
          ! grep -Ei '^(triton|nvidia-|.*cuda|.*cudnn|.*nccl)=' build/cpu-requirements.txt
      - name: Export locked CUDA 12.6 production dependency set
        run: >-
          uv export --locked --extra full --group cu126 --no-dev
          --no-emit-project -o build/cu126-requirements.txt
      - name: Generate CUDA 12.6 production dependency CycloneDX SBOM
        run: >-
          uv export --locked --extra full --group cu126 --no-dev
          --format cyclonedx1.5 --preview-features sbom-export
          -o build/sbom/python-cu126.cdx.json
      - name: Validate CUDA 12.6 dependency graph SBOM
        run: >-
          uv run --python 3.11 python scripts/validate_dependency_sbom.py
          build/sbom/python-cu126.cdx.json --profile cu126
      - name: Export locked CUDA 12.8 production dependency set
        run: >-
          uv export --locked --extra full --group cu128 --no-dev
          --no-emit-project -o build/cu128-requirements.txt
      - name: Generate CUDA 12.8 production dependency CycloneDX SBOM
        run: >-
          uv export --locked --extra full --group cu128 --no-dev
          --format cyclonedx1.5 --preview-features sbom-export
          -o build/sbom/python-cu128.cdx.json
      - name: Validate CUDA 12.8 dependency graph SBOM
        run: >-
          uv run --python 3.11 python scripts/validate_dependency_sbom.py
          build/sbom/python-cu128.cdx.json --profile cu128
      - name: Prepare audit-compatible CPU dependency set
        run: >-
          uv run --python 3.11 python scripts/prepare_vulnerability_audit_input.py
          build/cpu-requirements.txt build/cpu-audit-requirements.txt
      - name: Audit locked CPU production dependencies
        run: |
          set +e
          uv run --python 3.11 pip-audit -r build/cpu-audit-requirements.txt --disable-pip --no-deps \
            --strict --progress-spinner off -f json -o build/pip-audit.json
          status="$?"
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          uv run --python 3.11 python scripts/check_vulnerability_audit.py build/pip-audit.json
