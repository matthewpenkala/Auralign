name: trusted Windows model validation

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed 40-character commit on main
        required: true
        type: string

concurrency:
  group: trusted-windows-model-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, auralign-gpu]
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - profile: cpu
            platform: windows-amd64-cpu
            config: examples/config.strict-windows-amd64-cpu.yaml
          - profile: cu128
            platform: windows-amd64-cu128
            config: examples/config.strict-windows-amd64-cu128.yaml
    steps:
      - name: Protect runner-local paths before checkout cleanup
        shell: pwsh
        run: |
          $privatePaths = @(
            $env:LTM_VALIDATION_CAPSULE_DIR,
            $env:LTM_MODEL_CACHE,
            $env:LTM_ACCEPTANCE_EVIDENCE_DIR
          )
          if ($privatePaths.Where({ -not $_ }).Count -ne 0) {
            throw 'runner-local capsule, model cache, and evidence paths must be configured before checkout'
          }
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $workspacePrefix = $workspaceRoot + '\'
          foreach ($privatePath in $privatePaths) {
            $candidate = [IO.Path]::GetFullPath($privatePath)
            if ($candidate.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
                $candidate.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'private capsule, models, and evidence must remain outside the Actions checkout'
            }
          }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
          clean: true
      - name: Verify trusted immutable main commit
        shell: pwsh
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          if ($env:APPROVED_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'approved_sha must be a full lowercase commit ID'
          }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:APPROVED_SHA -or $head -ne $env:EXPECTED_MAIN_SHA) {
            throw 'validation commit is not the exact current private main commit'
          }
      - name: Verify runner-local private capsule is configured
        shell: pwsh
        run: |
          if (-not $env:LTM_VALIDATION_CAPSULE_DIR) {
            throw 'runner-local validation capsule is not configured'
          }
          if (-not (Test-Path $env:LTM_VALIDATION_CAPSULE_DIR -PathType Container)) {
            throw 'runner-local validation capsule is unavailable'
          }
          if (-not $env:LTM_MODEL_CACHE) {
            throw 'runner-local external model cache is not configured'
          }
          if (-not (Test-Path $env:LTM_MODEL_CACHE -PathType Container)) {
            throw 'runner-local external model cache is unavailable'
          }
          if (-not $env:LTM_ACCEPTANCE_EVIDENCE_DIR) {
            throw 'runner-local acceptance evidence directory is not configured'
          }
          if (-not (Test-Path $env:LTM_ACCEPTANCE_EVIDENCE_DIR -PathType Container)) {
            throw 'runner-local acceptance evidence directory is unavailable'
          }
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $workspacePrefix = $workspaceRoot + '\'
          $capsule = [IO.Path]::GetFullPath($env:LTM_VALIDATION_CAPSULE_DIR)
          $models = [IO.Path]::GetFullPath($env:LTM_MODEL_CACHE)
          $evidence = [IO.Path]::GetFullPath($env:LTM_ACCEPTANCE_EVIDENCE_DIR)
          if ($capsule.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
              $models.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
              $evidence.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
              $capsule.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase) -or
              $models.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase) -or
              $evidence.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'private capsule, models, and evidence must remain outside the Actions checkout'
          }
      - name: Provision exact locked profile outside checkout
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "auralign-${{ inputs.approved_sha }}-${{ matrix.profile }}"
          if (Test-Path $runtime) { Remove-Item -Recurse -Force $runtime }
          $installerProfile = if ('${{ matrix.profile }}' -eq 'cu128') { 'Cuda128' } else { 'Cpu' }
          & "$env:GITHUB_WORKSPACE\install-windows.ps1" `
            -Profile $installerProfile `
            -Destination $runtime `
            -SourceCheckout
          if ($LASTEXITCODE -ne 0) { throw 'locked profile provisioning failed' }
      - name: Run offline backend and private-media validation
        shell: pwsh
        env:
          HF_TOKEN: ""
          HF_HUB_OFFLINE: "1"
          LTM_HF_TOKEN: ""
          TRANSFORMERS_OFFLINE: "1"
          LTM_OFFLINE: "1"
          PYANNOTE_METRICS_ENABLED: "false"
          UV_NO_CACHE: "1"
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "auralign-${{ inputs.approved_sha }}-${{ matrix.profile }}"
          $python = Join-Path $runtime '.venv\Scripts\python.exe'
          & $python -B scripts/run_trusted_platform_validation.py `
            --profile '${{ matrix.profile }}' `
            --config '${{ matrix.config }}'
          if ($LASTEXITCODE -ne 0) { throw 'trusted model validation failed' }
      - name: Record path-redacted native dependency SBOM locally
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "auralign-${{ inputs.approved_sha }}-${{ matrix.profile }}"
          $python = Join-Path $runtime '.venv\Scripts\python.exe'
          $toolRuntime = Join-Path $env:RUNNER_TEMP "auralign-sbom-tool-${{ inputs.approved_sha }}-${{ matrix.profile }}"
          if (Test-Path $toolRuntime) { Remove-Item -Recurse -Force $toolRuntime }
          $env:UV_PROJECT_ENVIRONMENT = $toolRuntime
          uv sync --quiet --locked --python 3.11 --extra dev --extra api
          if ($LASTEXITCODE -ne 0) { throw 'locked SBOM tool provisioning failed' }
          $toolPython = Join-Path $toolRuntime 'Scripts\python.exe'
          $output = Join-Path $env:LTM_ACCEPTANCE_EVIDENCE_DIR '${{ matrix.platform }}.cdx.json'
          & $toolPython -B scripts/generate_environment_sbom.py `
            --python $python `
            --platform '${{ matrix.platform }}' `
            --profile '${{ matrix.profile }}' `
            --commit '${{ inputs.approved_sha }}' `
            --output $output
          if ($LASTEXITCODE -ne 0) { throw 'native dependency SBOM generation failed' }
          & $toolPython -B scripts/validate_dependency_sbom.py $output `
            --profile '${{ matrix.profile }}' `
            --platform '${{ matrix.platform }}' `
            --commit '${{ inputs.approved_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'native dependency SBOM validation failed' }
      - name: Remove generated validation outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .trusted-validation-work) {
            Remove-Item -Recurse -Force .trusted-validation-work
          }
          $runtime = Join-Path $env:RUNNER_TEMP "auralign-${{ inputs.approved_sha }}-${{ matrix.profile }}"
          if (Test-Path $runtime) {
            Remove-Item -Recurse -Force $runtime
          }
          $toolRuntime = Join-Path $env:RUNNER_TEMP "auralign-sbom-tool-${{ inputs.approved_sha }}-${{ matrix.profile }}"
          if (Test-Path $toolRuntime) {
            Remove-Item -Recurse -Force $toolRuntime
          }
