[project]
name = "local-transcript-max"
version = "0.2.0"
description = "Local, speaker-aware long-form transcription with diarization, QA, benchmarks, and exports."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Matthew Penkala" },
]
license = "LicenseRef-PolyForm-Internal-Use-1.0.0"
license-files = [
  "LICENSE",
  "LICENSES/*",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "compliance/THIRD_PARTY_COMPONENTS.generated.md",
]
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = [
  "huggingface-hub>=0.36,<1",
  "jiwer>=4,<5",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
ltm = "local_transcript_max.cli:app"

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.2.1,<2",
]
mlx = [
  "mlx-whisper>=0.4.3,<0.5; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
diarization = [
  "pyannote.audio>=4.0.4,<5",
  "aiohttp>=3.14.3,<4",
  "lightning @ https://github.com/Lightning-AI/pytorch-lightning/archive/d710d689510d50e800f53b3cd773cbca20b1f86f.tar.gz",
  "av==15.1.0",
  "torchcodec==0.7.0",
]
alignment = [
  "whisperx>=3.8.6,<4",
  "aiohttp>=3.14.3,<4",
  "lightning @ https://github.com/Lightning-AI/pytorch-lightning/archive/d710d689510d50e800f53b3cd773cbca20b1f86f.tar.gz",
  "nltk>=3.10.3,<4",
  "av==15.1.0",
  "torchcodec==0.7.0",
]
speaker-embeddings = [
  "speechbrain>=1.1.0,<2",
  "ruamel-yaml>=0.18.16,<0.19",
]
speaker-id = [
  "speechbrain>=1.1.0,<2",
  "ruamel-yaml>=0.18.16,<0.19",
]
cleanup-apple = [
  "apple-fm-sdk==0.2.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
presentation-sat = [
  "wtpsplit==2.2.1",
]
api = [
  "fastapi>=0.137,<1",
  "uvicorn[standard]>=0.30,<1",
]
full = [
  "faster-whisper>=1.2.1,<2",
  "pyannote.audio>=4.0.4,<5",
  "whisperx>=3.8.6,<4",
  "aiohttp>=3.14.3,<4",
  "lightning @ https://github.com/Lightning-AI/pytorch-lightning/archive/d710d689510d50e800f53b3cd773cbca20b1f86f.tar.gz",
  "nltk>=3.10.3,<4",
  "speechbrain>=1.1.0,<2",
  "ruamel-yaml>=0.18.16,<0.19",
  "av==15.1.0",
  "pillow==12.3.0",
  "torchcodec==0.7.0",
  "fastapi>=0.137,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "cyclonedx-bom>=7,<8",
  "mypy>=2,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "reuse>=6.2,<7",
  "ruff>=0.15,<1",
  "types-PyYAML>=6,<7",
]

[dependency-groups]
cpu = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
]
cu126 = [
  "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cu128 = [
  "torch==2.8.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "torchaudio==2.8.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "torchvision==0.23.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
  [
    { group = "cpu" },
    { group = "cu126" },
    { group = "cu128" },
  ],
]
exclude-dependencies = [
  { package = { name = "lightning" }, dependencies = ["pytorch-lightning", "torch"] },
  { package = { name = "torch", version = "2.8.0+cpu" }, dependencies = ["triton"] },
  { package = { name = "whisperx", version = "3.8.6" }, dependencies = ["triton"] },
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu126", group = "cu126" },
  { index = "pytorch-cu128", group = "cu128" },
]
torchaudio = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu126", group = "cu126" },
  { index = "pytorch-cu128", group = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu126", group = "cu126" },
  { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcript_max"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env.example"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: requires downloaded models or longer runtime",
  "gpu: requires a CUDA-capable host",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
  "av",
  "ctranslate2",
  "faster_whisper",
  "mlx_whisper",
  "nltk",
  "nltk.*",
  "pyannote",
  "pyannote.*",
  "speechbrain",
  "speechbrain.*",
  "torch",
  "torch.*",
  "torchaudio",
  "torchaudio.*",
  "torchcodec",
  "torchcodec.*",
  "whisperx",
  "whisperx.*",
]
ignore_missing_imports = true
